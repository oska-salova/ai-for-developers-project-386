name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Security scans depend on external data, so they also run weekly.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # commitlint compares against the pull request base, which a shallow
          # clone does not contain.
          fetch-depth: 0

      # Installs the tools pinned in mise.toml — the same ones used locally.
      - name: Setup mise
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: mise run deps

      # Runs the formatter, linters, type checks, knip, secret scan and agent rules.
      - name: Run checks
        run: mise run check

      - name: Lint commit messages
        if: github.event_name == 'pull_request'
        run: mise run commits
        env:
          COMMITLINT_FROM: ${{ github.event.pull_request.base.sha }}
          COMMITLINT_TO: ${{ github.event.pull_request.head.sha }}

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: mise run deps

      - name: Install Chromium for Playwright
        run: mise exec -- pnpm --dir frontend exec playwright install --with-deps chromium

      # The Playwright config builds the frontend and starts it on port 3000.
      - name: Run end-to-end tests
        run: mise run e2e

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # betterleaks scans the full history.
          fetch-depth: 0

      - name: Setup mise
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: mise run deps

      - name: Run security scans
        run: mise run security
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
