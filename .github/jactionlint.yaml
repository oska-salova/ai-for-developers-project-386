# yaml-language-server: $schema=https://raw.githubusercontent.com/jdx/jactionlint/main/schema/jactionlint-config.json

ignores:
  # hexlet-check.yml is generated by Hexlet and marked "DO NOT DELETE OR EDIT",
  # so its checkout step cannot be changed here. Revisit when Hexlet regenerates it.
  - file: ".github/workflows/hexlet-check.yml"
    rule: artipacked
    reason: "Upstream-generated workflow, not editable in this repository"
    expires: "2027-01-31"
